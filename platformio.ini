; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3
description = ACOS

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.esp32s3.psram = enabled
lib_deps = 
	adafruit/Adafruit BusIO @ ^1.14.1
	autowp/autowp-mcp2515@^1.3.1	#v1.3.1 # CAN-Bus Library
	coryjfowler/mcp_can@^1.5.1	#v1.0.7 # CAN-Bus Library
	m5stack/M5Unified@^0.1.17		# M5Unified Library; basic functionalities for CORES3-SE
    Arduino.h                   	# Arduino-Kernbibliothek
    lvgl/lvgl@^8.3.11         		# LVGL GUI Framework - temporarily disabled for testing
    adafruit/Adafruit BusIO@^1.14.1  # I²C/SPI-Hilfsbibliothek
    stdint.h                   # Standard Integer-Typen
    stdlib.h                   # Standardbibliothek
    stdio.h                    # Ein-/Ausgabefunktionen
    string.h                   # String-Funktionen

; Build-Optimierungen
build_flags = 
	-DLV_CONF_INCLUDE_SIMPLE
	-O2
	-Wall
	-DAPP_VERSION=${sysenv('GIT_TAG','dev')}
	-D CAN_SIMULATION		# Definieren Sie CAN_SIMULATION, um die Simulation zu aktivieren

	-D VERSION=0.0.1
    -D DEBUG=1
monitor_filters = colorize, esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup
;extra_scripts = 
	pre:scripts/pre_build.py
	post:scripts/post_build.py
;board_build.embed_files = 
	data/config.json

[env:m5stack-cores3-debug]
extends = env:m5stack-cores3
build_type = debug

[env:test]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-D UNIT_TEST
	-D CAN_SIMULATION
lib_deps =
	; Minimal dependencies for testing
build_src_filter = 
	+<test/>
	+<src/drivers/can_bus_mock.cpp>
	+<src/drivers/can_bus_mock.h>

; Unit Testing options
test_ignore = test_desktop
