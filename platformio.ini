; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3
description = ACOS

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.esp32s3.psram = enabled
lib_deps = 
	lvgl/lvgl @ ^8.3
	adafruit/Adafruit BusIO @ ^1.14.1
	https://github.com/autowp/arduino-mcp2515#v1.1.0
	m5stack/M5Unified@^0.1.17
    m5stack/M5CoreS3@^0.0.3   # Offizielle M5-Bibliothek
    Arduino.h                   # Arduino-Kernbibliothek
    lvgl/lvgl@^8.3.11         # LVGL GUI Framework
    adafruit/Adafruit BusIO@^1.14.1  # I²C/SPI-Hilfsbibliothek
    https://github.com/autowp/arduino-mcp2515#v1.1.0 # CAN-Bus Lib
    stdint.h                   # Standard Integer-Typen
    stdlib.h                   # Standardbibliothek
    stdio.h                    # Ein-/Ausgabefunktionen
    string.h                   # String-Funktionen

; Build-Optimierungen
build_flags = 
	-DLV_CONF_SKIP
	-O2
	-Wall
	-DAPP_VERSION=${sysenv('GIT_TAG','dev')}
monitor_filters = colorize, esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup
;extra_scripts = 
	pre:scripts/pre_build.py
	post:scripts/post_build.py
;board_build.embed_files = 
	data/config.json
